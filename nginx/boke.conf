# ============================================
# boke 博客 Nginx 反向代理配置
# 适用于 1Panel / OpenResty
# 部署路径：/usr/local/openresty/nginx/conf/conf.d/boke.conf
# 或通过 1Panel → 网站 → 配置 → 配置文件
# ============================================

# ----- 上游服务器定义 -----
upstream boke-blog {
    server 127.0.0.1:4321;
    keepalive 64;
}

upstream boke-api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name 38.22.90.40;

    # 上传文件大小限制（匹配 Express 10MB 限制）
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ========================================
    # 1. API 服务（优先匹配）
    #   所有 /api/ 请求转发到 Express 后端
    # ========================================
    location /api/ {
        proxy_pass http://boke-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # 上传文件大小限制
        client_max_body_size 10m;
    }

    # ========================================
    # 2. 管理后台（静态文件）
    #   React SPA, 所有 /admin 请求先匹配文件
    #   找不到文件时 fallback 到 index.html
    # ========================================
    location /admin {
        alias /opt/boke/apps/admin/dist;
        try_files $uri $uri/ /admin/index.html;

        # SPA 的 index.html 禁止缓存
        location ~ /index\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # 静态资源（JS/CSS/图片/字体）长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================
    # 3. 博客前端（Astro SSR）
    #   所有其他请求转发到 Astro 服务
    # ========================================
    location / {
        proxy_pass http://boke-blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时设置（SSR 渲染可能需要更长时间）
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # 禁止缓存 SSR 响应（由 Astro 自行控制缓存头）
        proxy_buffering off;
    }

    # ========================================
    # 4. 安全头
    # ========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================
    # 5. 日志（可选，1Panel 会自动配置）
    # ========================================
    access_log /var/log/nginx/boke-access.log;
    error_log /var/log/nginx/boke-error.log;
}

